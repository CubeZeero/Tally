services:
  tally:
    build: .
    container_name: tally
    restart: unless-stopped
    ports:
      - "6400:6400"
    environment:
      # Set a strong SESSION_SECRET in a .env file next to this file (git-ignored):
      #   SESSION_SECRET=$(openssl rand -base64 32)
      # If left empty, the app generates a random secret per process (sessions
      # reset on restart). Never commit a real secret to the repo.
      SESSION_SECRET: "${SESSION_SECRET:-}"
      DATABASE_URL: "file:/data/tally.db"
      # Notification send time follows this timezone.
      TZ: "${TZ:-Asia/Tokyo}"
      # Set to 1 to block new sign-ups after the first account is created.
      DISABLE_REGISTRATION: "${DISABLE_REGISTRATION:-}"
      # Optional SMTP for email notifications (leave unset to disable email).
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASS: "${SMTP_PASS:-}"
      SMTP_FROM: "${SMTP_FROM:-}"
    volumes:
      - tally-data:/data

volumes:
  tally-data:
